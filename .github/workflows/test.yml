name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: golang:1.25.10
    env:
      # Container checkout is often not a trusted git dir; go build VCS stamping
      # then fails with "error obtaining VCS status: exit status 128".
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v4
      - name: Install CI tools
        run: |
          # lock-held diagnostics assert holder PIDs via lsof
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq lsof >/dev/null
          fi
      - name: Go test
        run: go test -v ./...

      - name: Install doctest
        run: |
          if ! command -v doctest >/dev/null 2>&1; then
            go install github.com/xhd2015/doctest/cmd/doctest@latest
          fi
      - name: Doctest
        run: doctest test -v --label-all ./...