name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      COVERPKG: github.com/xhd2015/tty-watch/...
      COVERMODE: set
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go test
        run: |
          go test -count=1 \
            -covermode="$COVERMODE" \
            -coverpkg="$COVERPKG" \
            -coverprofile=coverage-gotest.out \
            ./...

      - name: Install doctest
        # External CLI (this repo is not doctest). @latest keeps CI on a released tool.
        # Run on the Ubuntu VM (not a golang container) so default VCS stamping works
        # without -buildvcs=false.
        run: go install github.com/xhd2015/doctest/cmd/doctest@latest

      # No e2e label in this tree (labels: slow, real-grok — opt-in only).
      # Default discovery runs unlabeled leaves: in-process contract + binary harness
      # mass under tests/ and pkgs/ttywatch/tests/naming. Skips slow / real-grok.
      - name: Doctest discovery (default labels)
        run: |
          doctest test -count=1 \
            -cover -covermode="$COVERMODE" \
            -coverpkg="$COVERPKG" \
            -coverprofile=coverage-doctest-discovery.out \
            ./...

      - name: Install xgo (coverage merge)
        # Prebuilt binary; see xgo doc/INSTALLATION.md (faster than go install in CI).
        run: |
          curl -fsSL https://github.com/xhd2015/xgo/raw/master/script/install/install.sh \
            | env INSTALL_TO_BIN=true bash
          xgo version

      - name: Merge coverage and report
        # Merge only profiles that exist (partial success still reports).
        # xgo tool coverage merge — do not reuse one -coverprofile path across stages.
        run: |
          set -euo pipefail
          profiles=()
          for f in coverage-gotest.out coverage-doctest-discovery.out; do
            if [[ -s "$f" ]]; then
              profiles+=("$f")
              echo "include $f ($(wc -c <"$f") bytes)"
            else
              echo "skip missing/empty $f"
            fi
          done
          if [[ ${#profiles[@]} -eq 0 ]]; then
            echo "No coverage profiles found" >&2
            exit 1
          fi
          xgo tool coverage merge -o coverage.out "${profiles[@]}"
          go tool cover -func=coverage.out | tee coverage-func.txt
          {
            echo "## Coverage (merged)"
            echo ""
            echo "Sources: ${profiles[*]}"
            echo ""
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
            echo ""
            echo "### Package breakdown (product, lowest first)"
            echo ""
            python3 script/ci/coverage-package-table.py coverage.out
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          if-no-files-found: ignore
          path: |
            coverage.out
            coverage-func.txt
            coverage-gotest.out
            coverage-doctest-discovery.out
